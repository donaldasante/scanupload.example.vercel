# ScanUpload QR Code Generator — Monorepo CI/CD
# Builds workspace packages and publishes core, nextjs-server, react, vanilla, vue, angular, and svelte to npm.

trigger:
    branches:
        include:
            - master
            - main

pool:
    vmImage: 'ubuntu-latest'

variables:
    - group: scanupload-qrcodegenerator-react-variables

steps:
    - checkout: self
      fetchDepth: 0

    - script: |
          git config --global user.email "azdo_ci@scanupload.net"
          git config --global user.name "Azure DevOps CI"
          git config --global http.postBuffer 524288000

          git remote add github https://$(GITHUB_PAT)@github.com/donaldasante/scanupload.example.vercel || true

          git push github HEAD:refs/heads/main --force
          git push github --tags --force
      displayName: Mirror repo to GitHub
